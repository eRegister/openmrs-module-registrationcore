# Minimal static log4j2 config for tests, in properties format.
#
# OpenmrsConfigurationFactory (SPI-registered by openmrs-api) unconditionally wraps and
# "enhances" any XML-formatted config with DB-driven log level overrides, which calls back
# into Context/ServiceContext before their own static initializers have finished running
# (triggered when a test statically mocks Context via PowerMockito). Using a properties-format
# config instead avoids OpenmrsConfigurationFactory's XML-specific handling entirely.
status = warn
name = RegistrationCoreTestConfig

appender.console.type = Console
appender.console.name = CONSOLE
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %p - %C{1}.%M(%L) |%d{ISO8601}| %m%n

logger.spring.name = org.springframework
logger.spring.level = warn

logger.hibernate.name = org.hibernate
logger.hibernate.level = error

rootLogger.level = warn
rootLogger.appenderRef.console.ref = CONSOLE
